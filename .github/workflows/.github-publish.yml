name: NuGet Package Publish

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # Obrigatório para Trusted Publishing (OIDC → chave temporária no nuget.org)
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore dependencies
        run: dotnet restore src/SoftExpertAPI.csproj

      - name: Build
        run: dotnet build src/SoftExpertAPI.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/SoftExpertAPI.csproj --configuration Release --no-build --output ./nupkgs

      # Troca o token OIDC do GitHub por uma API key temporária (~1h) no nuget.org
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          # Username do perfil nuget.org (NÃO o e-mail). Prefira secret.
          user: ${{ secrets.NUGET_USER }}

      - name: Push package
        run: >
          dotnet nuget push ./nupkgs/*.nupkg
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
